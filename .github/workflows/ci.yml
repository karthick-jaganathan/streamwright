name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and config validation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # No vendor SDKs here: the core must work without them (the connector tests run in the connectors job).
      # The connector packages install without their dependencies: core tests and examples load their definitions.
      - name: Install StreamWright
        run: |
          python -m pip install ./core pytest jsonschema responses "ruff==0.17.3"
          python -m pip install --no-deps connectors/*/*

      # Blocking: ruff (ruff.toml) and scripts/check_code_standards.py (docs/design/connector-contract.md section 7)
      - name: Check the code standards
        run: make lint

      - name: Run core tests
        run: python -m pytest core/tests -q

      # make check-vendored skips a companion that is not checked out
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          repository: karthick-jaganathan/streamwright-spark
          path: .contract-repos/streamwright-spark

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: karthick-jaganathan/streamwright-mcp
          path: .contract-repos/streamwright-mcp

      # the companions vendor scripts/check_code_standards.py: one checker, kept identical
      - name: Check the vendored code-standards checkers are identical
        run: make check-vendored COMPANIONS=".contract-repos/streamwright-spark .contract-repos/streamwright-mcp"

      - name: Check plug-in contracts (G1/G2)
        run: python scripts/check_plugin_contract.py

      - name: Check connector packaging
        run: python scripts/check_connectors.py

      - name: Validate example configs
        run: streamwright validate --strict --format github examples

  connectors:
    name: Connectors (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # Dynamically install all connectors and test dependencies; streamwright-spark from its main branch, which moves
      # with core (its PyPI release follows core's)
      - name: Install StreamWright, connectors and test dependencies
        run: |
          spark="git+https://github.com/karthick-jaganathan/streamwright-spark.git@main"
          python -m pip install "./core[serve]" connectors/*/* "streamwright-spark[all] @ $spark" pytest jsonschema \
            responses httpx \
            pyarrow deltalake "ruff==0.17.3"

      - name: Check the connectors are registered
        run: |
          out="$(streamwright connectors)"; echo "$out"
          for pp in connectors/*/*/pyproject.toml; do
            c="$(basename "$(dirname "$pp")")"
            echo "$out" | grep -qx "Name: $c" || { echo "missing connector: $c"; exit 1; }
          done

      - name: Lint and run tests (the ad connectors too)
        run: make test-all

  state-databases:
    name: State store on PostgreSQL and MySQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: sw, POSTGRES_PASSWORD: sw, POSTGRES_DB: sw}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U sw" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8
        env: {MYSQL_ROOT_PASSWORD: sw, MYSQL_DATABASE: sw}
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -psw --silent" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      STREAMWRIGHT_TEST_PG_DSN: postgresql://sw:sw@127.0.0.1:5432/sw
      STREAMWRIGHT_TEST_PG_URL: postgresql://sw:sw@127.0.0.1:5432/sw
      STREAMWRIGHT_TEST_MYSQL_URL: mysql://root:sw@127.0.0.1:3306/sw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # the state store's SQL per dialect (bulk outbox writes, leases, migrations), which SQLite and DuckDB do not cover
      - name: Install StreamWright and the database drivers
        run: python -m pip install ./core pytest "psycopg[binary]" pymysql

      - name: Run the state store tests on every dialect
        run: python -m pytest core/tests/jobs/state -q
