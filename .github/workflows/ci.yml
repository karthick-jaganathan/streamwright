name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and config validation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # No vendor SDKs here: the core must work without them (the connector tests run in the connectors job).
      # The connector packages install without their dependencies: core tests and examples load their definitions.
      - name: Install StreamWright
        run: |
          python -m pip install ./core pytest jsonschema responses "ruff==0.17.3"
          python -m pip install --no-deps connectors/*/*

      # Blocking: ruff (ruff.toml) and scripts/check_code_standards.py (docs/design/connector-contract.md section 7)
      - name: Check the code standards
        run: make lint

      - name: Run core tests
        run: python -m pytest core/tests -q

      # make check-vendored skips a companion that is not checked out
      - uses: actions/checkout@v7
        continue-on-error: true
        with:
          repository: karthick-jaganathan/streamwright-spark
          path: .contract-repos/streamwright-spark

      - uses: actions/checkout@v7
        with:
          repository: karthick-jaganathan/streamwright-mcp
          path: .contract-repos/streamwright-mcp

      # the companions vendor scripts/check_code_standards.py: one checker, kept identical
      - name: Check the vendored code-standards checkers are identical
        run: make check-vendored COMPANIONS=".contract-repos/streamwright-spark .contract-repos/streamwright-mcp"

      - name: Check plug-in contracts (G1/G2)
        run: python scripts/check_plugin_contract.py

      - name: Check connector packaging
        run: python scripts/check_connectors.py

      - name: Validate example configs
        run: streamwright validate --strict --format github examples

  connectors:
    name: Connectors and dlt (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Dynamically install all connectors and test dependencies
      - name: Install StreamWright, connectors and test dependencies
        run: |
          python -m pip install ./core connectors/*/* "streamwright-spark[all]~=0.1.0" pytest jsonschema responses \
            pyarrow deltalake "dlt[duckdb]>=1.0" "ruff==0.17.3"

      - name: Check the connectors are registered
        run: |
          out="$(streamwright connectors)"; echo "$out"
          for pp in connectors/*/*/pyproject.toml; do
            c="$(basename "$(dirname "$pp")")"
            echo "$out" | grep -qE "^\s+$c\s" || { echo "missing connector: $c"; exit 1; }
          done

      - name: Lint and run tests
        run: make test
