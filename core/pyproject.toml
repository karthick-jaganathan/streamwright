[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamwright"
version = "0.1.9"
description = "Declarative data connectors — pull from APIs, files and databases with YAML, shape with SQL, write anywhere."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Karthick Jaganathan", email = "kjaganathan.sde@gmail.com"},
]
keywords = ["data", "pipeline", "etl", "connector", "singer", "yaml", "duckdb", "rest-api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
dependencies = [
    "pyyaml==6.0.2",
    "requests>=2.25,<3",
    # `select`: the SQL that shapes each stream's records runs in an embedded DuckDB (which needs pytz for
    # timestamps with time zones)
    "duckdb>=2.0,<2.1",
    "pytz",
]

[project.optional-dependencies]
# --output dlt:DESTINATION; also install the destination's extra, e.g. "dlt[duckdb]" or "dlt[bigquery]"
dlt = ["dlt>=1.0"]

[project.urls]
Homepage = "https://streamwright.web.app"
Documentation = "https://streamwright.web.app/docs/"
Repository = "https://github.com/karthick-jaganathan/streamwright"
"Issue Tracker" = "https://github.com/karthick-jaganathan/streamwright/issues"

[project.scripts]
# `streamwright run`, `streamwright validate`, `streamwright connectors` - one CLI (see streamwright.core.cli)
streamwright = "streamwright.core.cli:main"
sw = "streamwright.core.cli:main"

[project.entry-points."streamwright.commands"]
duckdb = "streamwright.core.cli.commands.jobs:register"

[project.entry-points."streamwright.job_kinds"]
DuckDBJob = "streamwright.core.jobs.duckdb.plugin:JOB_ENGINE"

[project.entry-points."streamwright.duckdb.connectors"]
# the DuckDBJob engine's built-in adapters; every other provider's adapter ships with its connector
duckdb = "streamwright.core.jobs.duckdb.adapter:DuckDBCatalogAdapter"


[tool.setuptools]
# src layout: `streamwright` is a namespace package shared with the connector distributions (streamwright.connectors.*)
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
# every streamwright.core subpackage ships (jobs, sql, ...); `streamwright` itself stays a namespace
where = ["src"]
include = ["streamwright.core*"]
namespaces = true

[tool.setuptools.package-data]
"streamwright.core" = ["py.typed"]
"streamwright.core.sdk" = ["py.typed"]
"streamwright.core.jobs.duckdb" = ["guide.md"]
