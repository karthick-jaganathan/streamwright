# Campaigns, then each campaign's ad groups: a call step partitioned by the values of an earlier step.
# Run it (pip install streamwright-google-ads):
#   streamwright run examples/jobs/google_ads/ad_groups.yaml \
#     --set customer_id=<customer id> --set login_customer_id=<manager id> --secrets secrets.yaml
kind: DuckDBJob
version: 1
name: google_ads_ad_groups
description: Lists the enabled Search campaigns, then reads each campaign's ad groups (one call per campaign) and merges them into the warehouse.

spec:
  config:
    customer_id: {type: string, description: "the customer to read (digits only)"}
    login_customer_id: {type: string, description: the manager (MCC) account the calls go through}
  secrets:
    developer_token: {type: string}
    client_id: {type: string}
    client_secret: {type: string}
    refresh_token: {type: string}

connections:
  google_ads_api:
    provider: google_ads
    developer_token: "{{ secrets.developer_token }}"
    client_id: "{{ secrets.client_id }}"
    client_secret: "{{ secrets.client_secret }}"
    refresh_token: "{{ secrets.refresh_token }}"
    login_customer_id: "{{ config.login_customer_id }}"

  analytics_dw:
    provider: duckdb
    path: /tmp/google_ads_dw.duckdb

steps:
  # STEP 1: the campaigns (a call step); its `sql` reads the call's records from the table `records` (column `record`)
  - name: campaigns
    connection: google_ads_api
    service: GoogleAdsService
    method: search_stream
    arguments:
      customer_id: "{{ config.customer_id }}"
      query:
        gaql:
          select: [campaign.id, campaign.name]
          from: campaign
          where:
            - {field: campaign.status, op: "=", type: enum, value: ENABLED}
            - {field: campaign.advertising_channel_type, op: "=", type: enum, value: SEARCH}
    sql: |
      SELECT record->>'$.campaign.id'   AS campaign_id,
             record->>'$.campaign.name' AS campaign_name
      FROM records

  # STEP 2: each campaign's ad groups. `partitions` runs the call once per distinct campaign_id of `campaigns`
  # (pinned in the batch, so a replay makes the same calls); the value is {{ partition.campaign_id }}.
  - name: ad_groups
    connection: google_ads_api
    service: GoogleAdsService
    method: search_stream
    partitions:
      - {from: campaigns, field: campaign_id}
    # execution policy: these codes replace the connector's default retry codes for this step
    retry: {codes: [RESOURCE_EXHAUSTED, UNAVAILABLE, DEADLINE_EXCEEDED], max_attempts: 5, max_delay: 1m}
    rate_limit: {requests: 5, per: 1s}
    arguments:
      customer_id: "{{ config.customer_id }}"
      query:
        gaql:
          select: [campaign.id, ad_group.id, ad_group.name, ad_group.status]
          from: ad_group
          where:
            - {field: campaign.id, op: "=", type: int, value: "{{ partition.campaign_id }}"}
            - {field: ad_group.status, op: IN, type: enum, value: [ENABLED, PAUSED]}
    sql: |
      SELECT record->>'$.campaign.id'     AS campaign_id,
             record->>'$.ad_group.id'     AS ad_group_id,
             record->>'$.ad_group.name'   AS ad_group_name,
             record->>'$.ad_group.status' AS ad_group_status
      FROM records

  # STEP 3: ad groups with their campaign's name
  - name: campaign_ad_groups
    sql: |
      SELECT g.ad_group_id, g.ad_group_name, g.ad_group_status, c.campaign_id, c.campaign_name
      FROM ad_groups g
      JOIN campaigns c USING (campaign_id)

outputs:
  - name: save_ad_groups
    connection: analytics_dw
    step: campaign_ad_groups
    table: google_ads_ad_groups
    mode: merge
    primary_key: [ad_group_id]
