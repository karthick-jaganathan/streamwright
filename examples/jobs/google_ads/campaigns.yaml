kind: DuckDBJob
version: 1
name: google_ads_campaigns
description: Extracts live campaigns and ad groups directly from Google Ads via GoogleAdsService, calculates metrics in DuckDB, and merges into the analytical warehouse.

spec:
  config:
    customer_id: {type: string}
    login_customer_id: {type: string}
  secrets:
    developer_token: {type: string}
    client_id: {type: string}
    client_secret: {type: string}
    refresh_token: {type: string}

connections:
  google_ads_api:
    provider: google_ads
    developer_token: "{{ secrets.developer_token }}"
    client_id: "{{ secrets.client_id }}"
    client_secret: "{{ secrets.client_secret }}"
    refresh_token: "{{ secrets.refresh_token }}"
    login_customer_id: "{{ config.login_customer_id }}"

  analytics_dw:
    provider: duckdb
    path: /tmp/google_ads_dw.duckdb

steps:
  # STEP 1: Direct SDK connector call for campaigns
  - name: raw_campaigns
    description: Query Google Ads campaigns using GoogleAdsService
    connection: google_ads_api
    service: GoogleAdsService
    method: search_stream
    # execution policy (contract v1.2 §6a): retry transient gRPC errors, throttle calls, bound each call and tolerate
    retry: {max_attempts: 5, backoff: exponential, max_delay: 30s}
    rate_limit: {requests: 2, per: 1s}
    timeout: 60s
    on_error: fail
    arguments:
      customer_id: "{{ config.customer_id }}"
      query: |
        SELECT
          campaign.id,
          campaign.name,
          campaign.status,
          campaign.advertising_channel_type
        FROM campaign
        ORDER BY campaign.id
        LIMIT 50

  # STEP 2: Intermediate SQL parsing & shaping
  - name: parsed_campaigns
    description: Flatten nested protobuf struct fields into clean relational columns
    materialize: table
    sql: |
      SELECT
        campaign.id AS campaign_id,
        campaign.name AS campaign_name,
        campaign.status AS status,
        campaign.advertising_channel_type AS channel_type
      FROM raw_campaigns

  # STEP 3: Campaign status aggregations in DuckDB SQL
  - name: campaign_metrics
    description: Aggregate campaign totals by status and channel type
    materialize: table
    sql: |
      SELECT
        status,
        channel_type,
        COUNT(*) AS campaign_count
      FROM parsed_campaigns
      GROUP BY status, channel_type

  # STEP 4: Direct SDK connector call for ad groups
  - name: raw_ad_groups
    description: Query Google Ads ad groups using GoogleAdsService
    connection: google_ads_api
    service: GoogleAdsService
    method: search_stream
    arguments:
      customer_id: "{{ config.customer_id }}"
      query: |
        SELECT
          ad_group.id,
          ad_group.name,
          ad_group.status,
          campaign.id
        FROM ad_group
        ORDER BY ad_group.id
        LIMIT 50

  # STEP 5: Join campaigns and ad groups in DuckDB SQL
  - name: ad_group_hierarchy
    description: Join campaigns with their child ad groups
    materialize: table
    sql: |
      SELECT
        g.ad_group.id AS ad_group_id,
        g.ad_group.name AS ad_group_name,
        g.ad_group.status AS ad_group_status,
        c.campaign_id,
        c.campaign_name,
        c.status AS campaign_status,
        c.channel_type
      FROM raw_ad_groups g
      JOIN parsed_campaigns c ON g.campaign.id = c.campaign_id

outputs:
  # Output 1: Campaign metrics summary
  - name: save_campaign_metrics
    connection: analytics_dw
    step: campaign_metrics
    table: google_ads_campaign_metrics
    mode: overwrite

  # Output 2: Acid merge into target hierarchy table
  - name: save_hierarchy
    connection: analytics_dw
    step: ad_group_hierarchy
    table: google_ads_hierarchy
    mode: merge
    # retry a transient warehouse write; a failed write fails the batch (on_error defaults to fail)
    retry: {max_attempts: 3}
    timeout: 120s
    primary_key:
      - ad_group_id

runtime:
  threads: 4
  memory_limit: 1GB
