# Uploads offline click conversions (a row per conversion, given with --input) to a Google Ads account, by
# conversion action name (conversion_actions/create.yaml creates the actions).
#
#   mkdir -p examples/google_ads/.streamwright                # once: the state folder (git-ignored)
#   # a dry run: Google checks every conversion and records none
#   streamwright duckdb run examples/google_ads/jobs/conversions/upload.yaml \
#     --input examples/google_ads/payloads/conversions/clicks.json \
#     --set customer_id=CUSTOMER_ID --set login_customer_id=MANAGER_ID --set validate_only=true \
#     --secrets ~/.streamwright/google-ads-secrets.yaml --apply-state-migrations
#   # upload: drop validate_only; --job-key uploads-2026-01-31 makes one payload upload once
#
# Shown here:
#   - one search for just the actions the payload names: a step makes them one list, the search's partition, and
#     GAQL filters `conversion_action.name IN (...)`;
#   - a conversion naming an action the account does not have is skipped, a warning each (a step's `log:`);
#   - the conversions go in calls of `apply.chunk_size` rows, each call logged with its rows and time;
#   - once sent, the output's `log:` selects the rejected rows from its results and logs Google's reason for each.
# A gclid must come from a real click on the account (the payload's are placeholders: Google rejects them), within
# the action's lookback window and before conversion_date_time. Google deduplicates a conversion (gclid, action and
# time, or order_id), so a row sent again is not counted twice.
kind: DuckDBJob
version: 1
name: google_ads_conversions_upload
description: Offline click conversions uploaded to a Google Ads account's conversion actions, by action name

spec:
  config:
    customer_id: {type: string, required: true, pattern: "^[0-9]{10}$", description: "the account (10 digits)"}
    login_customer_id: {type: string, required: true, pattern: "^[0-9]{10}$", description: "the manager account"}
    validate_only: {type: boolean, default: false, description: "true: Google checks the conversions, records none"}
  secrets:
    developer_token: {type: string, required: true}
    client_id: {type: string, required: true}
    client_secret: {type: string, required: true}
    refresh_token: {type: string, required: true}
  input:
    columns:
      gclid: {type: string, required: true, max_length: 200}
      conversion_action: {type: string, required: true, max_length: 100}      # the action's name
      conversion_date_time:                                                    # with the account's offset
        type: string
        required: true
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}[+-][0-9]{2}:[0-9]{2}$"
      conversion_value: {type: number, minimum: 0}
      currency_code: {type: string, pattern: "^[A-Z]{3}$"}
      order_id: {type: string, max_length: 100}                               # Google deduplicates on it
    max_rows: 10000

connections:
  ads:
    provider: google_ads
    developer_token: "{{ secrets.developer_token }}"
    client_id: "{{ secrets.client_id }}"
    client_secret: "{{ secrets.client_secret }}"
    refresh_token: "{{ secrets.refresh_token }}"
    login_customer_id: "{{ config.login_customer_id }}"

steps:
  # the action names the conversions use: one row, one list (the partition of the search below)
  - name: requested_actions
    sql: SELECT list(DISTINCT conversion_action ORDER BY conversion_action) AS names FROM input

  # those of the account's enabled upload-click actions: one search, `conversion_action.name IN (...)`
  - name: upload_actions
    connection: ads
    operation:
      service: GoogleAdsService
      method: search_stream
      arguments:
        customer_id: "{{ config.customer_id }}"
        query:
          gaql:
            select: [conversion_action.name, conversion_action.resource_name]
            from: conversion_action
            where:
              - {field: conversion_action.type, op: "=", type: enum, value: UPLOAD_CLICKS}
              - {field: conversion_action.status, op: "=", type: enum, value: ENABLED}
              - {field: conversion_action.name, op: IN, type: string, value: "{{ partition.names }}"}
    partitions: [{from: requested_actions, field: names}]
    sql: |
      SELECT record->>'$.conversion_action.name' AS name,
             record->>'$.conversion_action.resource_name' AS resource_name
      FROM records

  # the conversions whose action the account does not have: skipped, a warning each
  - name: skipped_conversions
    sql: |
      SELECT i.gclid, i.conversion_action, i.order_id
      FROM input AS i
      ANTI JOIN upload_actions AS a ON a.name = i.conversion_action
    log:
      message: "skipped gclid {gclid} (order {order_id}): no enabled upload-click action named {conversion_action}"
      level: warning
      max_rows: 50

  # the conversions to upload; columns are ClickConversion fields
  - name: conversions
    sql: |
      SELECT i.gclid,
             a.resource_name AS conversion_action,
             i.conversion_date_time,
             i.conversion_value,
             i.currency_code,
             i.order_id
      FROM input AS i
      JOIN upload_actions AS a ON a.name = i.conversion_action

outputs:
  - name: upload
    connection: ads
    step: conversions
    operation:
      service: ConversionUploadService
      method: upload_click_conversions
      arguments:
        customer_id: "{{ config.customer_id }}"
        validate_only: "{{ config.validate_only }}"
    apply:
      chunk_size: 10              # small, to show the calls; leave it out in production (2000 a call)
      nulls: skip_field           # no value, currency or order_id: the field is left out
      on_row_error: continue      # a rejected conversion fails alone (logged below; `state show` keeps it too)
    policy:
      retry: {max_attempts: 5, backoff: exponential}
    # once the rows are sent: a line per rejected conversion, from the results (the table `upload`: the columns
    # above, and outcome.status, outcome.error_code, outcome.error_message, outcome.result, outcome.row)
    log:
      sql: |
        SELECT outcome.row AS row, gclid, order_id, outcome.error_code AS code, outcome.error_message AS error
        FROM upload
        WHERE outcome.status = 'failed'
        ORDER BY outcome.row
      message: "row {row}: gclid {gclid} (order {order_id}) rejected: {code}: {error}"
      level: warning
      max_rows: 50

runtime:
  state:
    sqlite: ../../.streamwright/google_ads_conversions_upload.state.db
    scope: "customer:{{ config.customer_id }}"
