# Uploads a folder of offline click conversion files (a client's drop folder) FILE BY FILE, several files at once:
# one pass of the job per file (runtime.fan_out), each in its own state scope. Each pass's job key is its file's
# last-modified time, so a file is uploaded once: an hourly run uploads only the files that are new or changed since
# and logs `skip: ... a batch with this job key already ran` for the others. A file that fails does not stop the
# others; --summary lists every file's pass.
#
#   mkdir -p examples/google_ads/.streamwright                # once: the state folder (git-ignored)
#   streamwright duckdb run examples/google_ads/jobs/conversions/upload_folder.yaml \
#     --set folder=$PWD/examples/google_ads/payloads/conversions/incoming \
#     --set customer_id=CUSTOMER_ID --set login_customer_id=MANAGER_ID --set validate_only=true \
#     --secrets ~/.streamwright/google-ads-secrets.yaml --apply-state-migrations --summary
#   (--fan-out-concurrency N overrides the 5 files at once)
#
# A file is a JSON array of conversions like payloads/conversions/clicks.json; it may leave the optional keys out. Every line
# a pass logs carries its file: `[google_ads_conversions_upload_folder file=conversions-02.json step=...]`.
kind: DuckDBJob
version: 1
name: google_ads_conversions_upload_folder
description: A folder's offline click conversion files uploaded to a Google Ads account, file by file

spec:
  config:
    customer_id: {type: string, required: true, pattern: "^[0-9]{10}$", description: "the account (10 digits)"}
    login_customer_id: {type: string, required: true, pattern: "^[0-9]{10}$", description: "the manager account"}
    validate_only: {type: boolean, default: false, description: "true: Google checks the conversions, records none"}
    folder: {type: string, required: true, description: "the folder of conversion files (*.json), absolute"}
    # the pass's file: its name and last change (bound from the `files` lookup's row)
    file: {type: string, pattern: "^[A-Za-z0-9_-][A-Za-z0-9._-]*$", lookup: {from: file, field: name}}
    modified: {type: string, lookup: {from: file, field: modified}}
  secrets:
    developer_token: {type: string, required: true}
    client_id: {type: string, required: true}
    client_secret: {type: string, required: true}
    refresh_token: {type: string, required: true}
  lookups:
    # the folder's files, oldest first
    files:
      type: database
      connection: listing
      query: |
        SELECT parse_filename(filename) AS name, strftime(last_modified, '%Y%m%dT%H%M%S') AS modified
        FROM read_blob(:pattern)
        ORDER BY last_modified, name
      params: {pattern: "{{ config.folder }}/*.json"}
      rows: many

connections:
  listing: {provider: duckdb, path: ":memory:"}
  incoming:
    provider: files
    roots: ["{{ config.folder }}"]
  ads:
    provider: google_ads
    developer_token: "{{ secrets.developer_token }}"
    client_id: "{{ secrets.client_id }}"
    client_secret: "{{ secrets.client_secret }}"
    refresh_token: "{{ secrets.refresh_token }}"
    login_customer_id: "{{ config.login_customer_id }}"

steps:
  # the pass's file
  - name: file_rows
    connection: incoming
    read: json
    path: "{{ config.file }}"

  # its conversions, every column present (a file may leave the optional ones out) and typed
  - name: clicks
    sql: |
      SELECT * FROM (SELECT NULL::VARCHAR AS gclid, NULL::VARCHAR AS conversion_action,
                            NULL::VARCHAR AS conversion_date_time, NULL::DOUBLE AS conversion_value,
                            NULL::VARCHAR AS currency_code, NULL::VARCHAR AS order_id WHERE false)
      UNION ALL BY NAME
      SELECT * FROM file_rows

  # the action names the file uses: one row, one list (the partition of the search below)
  - name: requested_actions
    sql: SELECT list(DISTINCT conversion_action ORDER BY conversion_action) AS names FROM clicks

  # those of the account's enabled upload-click actions: one search, `conversion_action.name IN (...)`
  - name: upload_actions
    connection: ads
    operation:
      service: GoogleAdsService
      method: search_stream
      arguments:
        customer_id: "{{ config.customer_id }}"
        query:
          gaql:
            select: [conversion_action.name, conversion_action.resource_name]
            from: conversion_action
            where:
              - {field: conversion_action.type, op: "=", type: enum, value: UPLOAD_CLICKS}
              - {field: conversion_action.status, op: "=", type: enum, value: ENABLED}
              - {field: conversion_action.name, op: IN, type: string, value: "{{ partition.names }}"}
    partitions: [{from: requested_actions, field: names}]
    sql: |
      SELECT record->>'$.conversion_action.name' AS name,
             record->>'$.conversion_action.resource_name' AS resource_name
      FROM records

  # the conversions whose action the account does not have: skipped, a warning each
  - name: skipped_conversions
    sql: |
      SELECT i.gclid, i.conversion_action, i.order_id
      FROM clicks AS i
      ANTI JOIN upload_actions AS a ON a.name = i.conversion_action
    log:
      message: "skipped gclid {gclid} (order {order_id}): no enabled upload-click action named {conversion_action}"
      level: warning
      max_rows: 50

  # the conversions to upload; columns are ClickConversion fields. The JSON reader takes "2026-01-31 09:07:00-05:00"
  # as a timestamp: it is sent as the same instant in UTC ("2026-01-31 14:07:00+00:00"), a format Google takes.
  - name: conversions
    sql: |
      SELECT i.gclid,
             a.resource_name AS conversion_action,
             strftime(timezone('UTC', i.conversion_date_time::TIMESTAMPTZ), '%Y-%m-%d %H:%M:%S') || '+00:00'
               AS conversion_date_time,
             i.conversion_value,
             i.currency_code,
             i.order_id
      FROM clicks AS i
      JOIN upload_actions AS a ON a.name = i.conversion_action

outputs:
  - name: upload
    connection: ads
    step: conversions
    operation:
      service: ConversionUploadService
      method: upload_click_conversions
      arguments:
        customer_id: "{{ config.customer_id }}"
        validate_only: "{{ config.validate_only }}"
    apply:
      nulls: skip_field           # no value, currency or order_id: the field is left out
      on_row_error: continue      # a rejected conversion fails alone, logged below
    policy:
      retry: {max_attempts: 5, backoff: exponential}
    log:
      sql: |
        SELECT outcome.row AS row, gclid, order_id, outcome.error_code AS code, outcome.error_message AS error
        FROM upload
        WHERE outcome.status = 'failed'
        ORDER BY outcome.row
      message: "row {row}: gclid {gclid} (order {order_id}) rejected: {code}: {error}"
      level: warning
      max_rows: 50

runtime:
  fan_out: {over: files, as: file, concurrency: 5, on_failure: continue, on_empty: skip}
  state:
    sqlite: ../../.streamwright/google_ads_conversions_upload_folder.state.db
    scope: "customer:{{ config.customer_id }}:file:{{ config.file }}"
    job_key: "file-{{ config.modified }}"
