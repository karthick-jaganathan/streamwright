# Sends offline conversions (a row per conversion, given with --input) to a Google Ads conversion action through the
# Data Manager API (IngestionService.ingest_events).
#
#   mkdir -p examples/google_data_manager/.streamwright          # once: the state folder (git-ignored)
#   # a dry run: Google checks every event and ingests none
#   streamwright duckdb run examples/google_data_manager/jobs/conversions/ingest.yaml \
#     --input examples/google_data_manager/payloads/conversions/offline.json \
#     --set operating_account=CUSTOMER_ID --set login_account=MANAGER_ID --set conversion_action_id=ACTION_ID \
#     --set ad_user_data_consent=CONSENT_GRANTED --set ad_personalization_consent=CONSENT_GRANTED \
#     --set validate_only=true \
#     --secrets ~/.streamwright/google-data-manager-secrets.yaml --apply-state-migrations
#   # send: drop validate_only; --job-key conversions-2026-01-31 makes one payload send once
#
# Shown here:
#   - user identifiers normalized and SHA-256 hashed in SQL, as Google's formatting guide (and its
#     google-ads-datamanager-util Formatter) asks: trimmed, lowercase, Gmail dots and +suffix removed; phones as +digits;
#   - a complete Event a row, built in SQL: the identifiers as JSON (user_data), the gclid and the conversion's own
#     consent as STRUCTs (ad_identifiers, consent); the request's fields (destinations, its default consent) are the
#     output's arguments;
#   - up to 2000 events a request (the operation's max_chunk); Google deduplicates on transaction_id, so a request cut
#     short is sent again;
#   - Google processes a request later: each row's result keeps its request_id and record_index, which
#     jobs/requests/status.yaml reads back (failed record indices per destination).
kind: DuckDBJob
version: 1
name: google_data_manager_conversions_ingest
description: Offline conversions sent to a Google Ads conversion action through the Data Manager API

spec:
  config:
    operating_account: {type: string, required: true, pattern: "^[0-9]{10}$", description: "the Google Ads account"}
    login_account: {type: string, required: true, pattern: "^[0-9]{10}$", description: "the account the user is in"}
    conversion_action_id: {type: string, required: true, pattern: "^[0-9]+$",
                           description: "the UPLOAD_CLICKS conversion action"}
    validate_only: {type: boolean, default: false, description: "true: Google checks the events, ingests none"}
    ad_user_data_consent: {type: string, required: true, enum: [CONSENT_GRANTED, CONSENT_DENIED],
                           description: "the consent collected to send user data (rows without their own)"}
    ad_personalization_consent: {type: string, required: true, enum: [CONSENT_GRANTED, CONSENT_DENIED],
                                 description: "the consent collected for personalization (rows without their own)"}
  secrets:
    client_id: {type: string, required: true}
    client_secret: {type: string, required: true}
    refresh_token: {type: string, required: true}
  input:
    columns:
      transaction_id: {type: string, required: true, max_length: 200}      # Google deduplicates on it
      converted_at:                                                        # with its offset
        type: string
        required: true
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}[ T][0-9]{2}:[0-9]{2}:[0-9]{2}([+-][0-9]{2}:[0-9]{2}|Z)$"
      gclid: {type: string, max_length: 200}
      value: {type: number, minimum: 0}
      currency: {type: string, pattern: "^[A-Z]{3}$"}
      email: {type: string, max_length: 320}
      phone: {type: string, max_length: 32}
      # the person's consent (EEA users); a conversion without it gets the request's (the output's `consent`)
      ad_user_data_consent: {type: string, enum: [CONSENT_GRANTED, CONSENT_DENIED]}
      ad_personalization_consent: {type: string, enum: [CONSENT_GRANTED, CONSENT_DENIED]}
    max_rows: 100000

connections:
  dm:
    provider: google_data_manager
    client_id: "{{ secrets.client_id }}"
    client_secret: "{{ secrets.client_secret }}"
    refresh_token: "{{ secrets.refresh_token }}"

steps:
  # the identifiers normalized as Google asks (google-ads-datamanager-util's Formatter gives the same values)
  - name: normalized
    sql: |
      SELECT *,
             CASE WHEN split_part(lower(trim(email)), '@', 2) IN ('gmail.com', 'googlemail.com')
                  THEN replace(split_part(split_part(lower(trim(email)), '@', 1), '+', 1), '.', '') || '@' ||
                       split_part(lower(trim(email)), '@', 2)
                  ELSE lower(trim(email)) END                           AS normalized_email,
             '+' || nullif(regexp_replace(phone, '[^0-9]', '', 'g'), '')  AS normalized_phone
      FROM input

  # the conversions without an identifier: skipped, a warning each (Google needs a gclid or user data)
  - name: unidentified
    sql: |
      SELECT transaction_id
      FROM normalized
      WHERE gclid IS NULL AND normalized_email IS NULL AND normalized_phone IS NULL
    log:
      message: "skipped transaction {transaction_id}: no gclid, email or phone"
      level: warning
      max_rows: 50

  # the events, a complete Event a row (its columns are Event fields)
  - name: events
    sql: |
      SELECT transaction_id,
             converted_at                                                  AS event_timestamp,
             'WEB'                                                         AS event_source,
             CASE WHEN gclid IS NOT NULL THEN {'gclid': gclid} END         AS ad_identifiers,
             value                                                         AS conversion_value,
             currency,
             CASE WHEN normalized_email IS NOT NULL OR normalized_phone IS NOT NULL
                  THEN json_object('user_identifiers', list_filter([
                         CASE WHEN normalized_email IS NOT NULL
                              THEN json_object('email_address', sha256(normalized_email)) END,
                         CASE WHEN normalized_phone IS NOT NULL
                              THEN json_object('phone_number', sha256(normalized_phone)) END
                       ], lambda identifier: identifier IS NOT NULL))
             END                                                           AS user_data,
             CASE WHEN ad_user_data_consent IS NOT NULL OR ad_personalization_consent IS NOT NULL
                  THEN {'ad_user_data': ad_user_data_consent, 'ad_personalization': ad_personalization_consent}
             END                                                           AS consent
      FROM normalized
      WHERE gclid IS NOT NULL OR normalized_email IS NOT NULL OR normalized_phone IS NOT NULL

outputs:
  - name: ingest
    connection: dm
    step: events
    operation:
      service: IngestionService
      method: ingest_events
      arguments:
        destinations:
          - operating_account: {account_type: GOOGLE_ADS, account_id: "{{ config.operating_account }}"}
            login_account: {account_type: GOOGLE_ADS, account_id: "{{ config.login_account }}"}
            product_destination_id: "{{ config.conversion_action_id }}"
        # the default for the conversions without their own `consent`
        consent: {ad_user_data: "{{ config.ad_user_data_consent }}",
                  ad_personalization: "{{ config.ad_personalization_consent }}"}
        encoding: HEX
        validate_only: "{{ config.validate_only }}"
    apply:
      nulls: skip_field           # no value, currency, gclid or user data: the field is left out
      on_row_error: continue      # a rejected event fails alone (logged below; `state show` keeps it too)
    policy:
      retry: {max_attempts: 5, backoff: exponential}
    # once sent, what Google returned: a line per request (its id: requests/status.yaml reads it back), per rejected
    # event (Google's reason as the code) and per event accepted with field warnings (optional fields dropped)
    log:
      sql: |
        SELECT 'request ' || coalesce(outcome.result->>'$.request_id', '-')  AS subject,
               outcome.status                                                AS outcome,
               count(*) || ' event(s)'                                       AS detail
        FROM ingest
        GROUP BY ALL
        UNION ALL
        SELECT 'transaction ' || transaction_id, outcome.error_code, outcome.error_message
        FROM ingest
        WHERE outcome.status = 'failed'
        UNION ALL
        SELECT 'transaction ' || transaction_id, 'warnings', CAST(outcome.result->'$.warnings' AS VARCHAR)
        FROM ingest
        WHERE (outcome.result->'$.warnings') IS NOT NULL
        ORDER BY subject
      message: "{subject}: {outcome}: {detail}"
      max_rows: 100

runtime:
  state:
    sqlite: ../../.streamwright/google_data_manager_conversions_ingest.state.db
    scope: "account:{{ config.operating_account }}"
