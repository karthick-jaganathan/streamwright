# Sends offline conversions (a row per conversion, given with --input) to Google Ads conversion actions named in the
# payload: the names are looked up with the Google Ads API (google_ads connector), and each event says where it goes
# (its `destination`), so one payload can feed several actions through the Data Manager API.
#
#   streamwright duckdb run examples/google_data_manager/jobs/conversions/ingest_by_action_name.yaml \
#     --input examples/google_data_manager/payloads/conversions/offline_by_action_name.json \
#     --set operating_account=CUSTOMER_ID --set login_account=MANAGER_ID \
#     --set ad_user_data_consent=CONSENT_GRANTED --set ad_personalization_consent=CONSENT_GRANTED \
#     --set validate_only=true \
#     --secrets ~/.streamwright/google-data-manager-secrets.yaml --apply-state-migrations
#
# The secrets file also needs the Google Ads developer_token, and the refresh token both scopes (adwords and
# datamanager), since both APIs are called with it.
#
# Shown here:
#   - one Google Ads search for just the actions the payload names (a step makes them one list, the search's
#     partition; GAQL `conversion_action.name IN (...)`); a conversion naming an unknown action is skipped, a warning
#     each;
#   - a complete Event a row, its destination too: the action's id is the destination's product_destination_id; as
#     Google's guide has it, a request lists the chunk's actions as its destinations (each with a reference) and each
#     event's destination_references names its own;
#   - the identifiers normalized and SHA-256 hashed in SQL, as in conversions/ingest.yaml.
kind: DuckDBJob
version: 1
name: google_data_manager_conversions_by_action_name
description: Offline conversions sent to Google Ads conversion actions named in the payload, through the Data Manager API

spec:
  config:
    operating_account: {type: string, required: true, pattern: "^[0-9]{10}$", description: "the Google Ads account"}
    login_account: {type: string, required: true, pattern: "^[0-9]{10}$", description: "the account the user is in"}
    validate_only: {type: boolean, default: false, description: "true: Google checks the events, ingests none"}
    ad_user_data_consent: {type: string, required: true, enum: [CONSENT_GRANTED, CONSENT_DENIED],
                           description: "the consent collected to send user data (rows without their own)"}
    ad_personalization_consent: {type: string, required: true, enum: [CONSENT_GRANTED, CONSENT_DENIED],
                                 description: "the consent collected for personalization (rows without their own)"}
  secrets:
    developer_token: {type: string, required: true}
    client_id: {type: string, required: true}
    client_secret: {type: string, required: true}
    refresh_token: {type: string, required: true}
  input:
    columns:
      conversion_action: {type: string, required: true, max_length: 100}  # the action's name
      transaction_id: {type: string, required: true, max_length: 200}     # Google deduplicates on it
      converted_at:                                                       # with its offset
        type: string
        required: true
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}[ T][0-9]{2}:[0-9]{2}:[0-9]{2}([+-][0-9]{2}:[0-9]{2}|Z)$"
      gclid: {type: string, max_length: 200}
      value: {type: number, minimum: 0}
      currency: {type: string, pattern: "^[A-Z]{3}$"}
      email: {type: string, max_length: 320}
      phone: {type: string, max_length: 32}
    max_rows: 100000

connections:
  ads:
    provider: google_ads
    developer_token: "{{ secrets.developer_token }}"
    client_id: "{{ secrets.client_id }}"
    client_secret: "{{ secrets.client_secret }}"
    refresh_token: "{{ secrets.refresh_token }}"
    login_customer_id: "{{ config.login_account }}"
  dm:
    provider: google_data_manager
    client_id: "{{ secrets.client_id }}"
    client_secret: "{{ secrets.client_secret }}"
    refresh_token: "{{ secrets.refresh_token }}"

steps:
  # the action names the conversions use: one row, one list (the partition of the search below)
  - name: requested_actions
    sql: SELECT list(DISTINCT conversion_action ORDER BY conversion_action) AS action_names FROM input

  # those of the account's enabled upload-click actions, with their ids: one search
  - name: conversion_actions
    connection: ads
    operation:
      service: GoogleAdsService
      method: search_stream
      arguments:
        customer_id: "{{ config.operating_account }}"
        query:
          gaql:
            select: [conversion_action.id, conversion_action.name]
            from: conversion_action
            where:
              - {field: conversion_action.type, op: "=", type: enum, value: UPLOAD_CLICKS}
              - {field: conversion_action.status, op: "=", type: enum, value: ENABLED}
              - {field: conversion_action.name, op: IN, type: string, value: "{{ partition.action_names }}"}
    partitions: [{from: requested_actions, field: action_names}]
    sql: |
      SELECT record->>'$.conversion_action.name' AS action_name,
             record->>'$.conversion_action.id'   AS action_id
      FROM records

  # the conversions whose action the account does not have: skipped, a warning each
  - name: unknown_actions
    sql: |
      SELECT conversions.transaction_id, conversions.conversion_action
      FROM input AS conversions
      ANTI JOIN conversion_actions AS actions ON actions.action_name = conversions.conversion_action
    log:
      message: "skipped transaction {transaction_id}: no enabled upload-click action named {conversion_action}"
      level: warning
      max_rows: 50

  # the conversions of known actions, their identifiers normalized as Google asks
  - name: normalized
    sql: |
      SELECT conversions.*,
             actions.action_id,
             CASE WHEN split_part(lower(trim(conversions.email)), '@', 2) IN ('gmail.com', 'googlemail.com')
                  THEN replace(split_part(split_part(lower(trim(conversions.email)), '@', 1), '+', 1), '.', '') ||
                       '@' || split_part(lower(trim(conversions.email)), '@', 2)
                  ELSE lower(trim(conversions.email)) END                             AS normalized_email,
             '+' || nullif(regexp_replace(conversions.phone, '[^0-9]', '', 'g'), '')  AS normalized_phone
      FROM input AS conversions
      JOIN conversion_actions AS actions ON actions.action_name = conversions.conversion_action

  # the events, a complete Event a row, with the destination (the action) it goes to
  - name: events
    sql: |
      SELECT transaction_id,
             converted_at                                                  AS event_timestamp,
             'WEB'                                                         AS event_source,
             CASE WHEN gclid IS NOT NULL THEN {'gclid': gclid} END         AS ad_identifiers,
             value                                                         AS conversion_value,
             currency,
             CASE WHEN normalized_email IS NOT NULL OR normalized_phone IS NOT NULL
                  THEN json_object('user_identifiers', list_filter([
                         CASE WHEN normalized_email IS NOT NULL
                              THEN json_object('email_address', sha256(normalized_email)) END,
                         CASE WHEN normalized_phone IS NOT NULL
                              THEN json_object('phone_number', sha256(normalized_phone)) END
                       ], lambda identifier: identifier IS NOT NULL))
             END                                                           AS user_data,
             {'operating_account': {'account_type': 'GOOGLE_ADS', 'account_id': '{{ config.operating_account }}'},
              'login_account': {'account_type': 'GOOGLE_ADS', 'account_id': '{{ config.login_account }}'},
              'product_destination_id': action_id}                         AS destination
      FROM normalized
      WHERE gclid IS NOT NULL OR normalized_email IS NOT NULL OR normalized_phone IS NOT NULL

outputs:
  - name: ingest
    connection: dm
    step: events
    operation:
      service: IngestionService
      method: ingest_events
      arguments:                  # no `destinations`: each event's own `destination` says where it goes
        # the consent you actually collected (required config, no default): never assume it was granted
        consent: {ad_user_data: "{{ config.ad_user_data_consent }}",
                  ad_personalization: "{{ config.ad_personalization_consent }}"}
        encoding: HEX
        validate_only: "{{ config.validate_only }}"
    apply:
      nulls: skip_field
      on_row_error: continue
    policy:
      retry: {max_attempts: 5, backoff: exponential}
    # once sent, what Google returned: a line per request (its id: requests/status.yaml reads it back), per rejected
    # event (Google's reason as the code) and per event accepted with field warnings (optional fields dropped)
    log:
      sql: |
        SELECT 'request ' || coalesce(outcome.result->>'$.request_id', '-')  AS subject,
               outcome.status                                                AS outcome,
               count(*) || ' event(s)'                                       AS detail
        FROM ingest
        GROUP BY ALL
        UNION ALL
        SELECT 'transaction ' || transaction_id, outcome.error_code, outcome.error_message
        FROM ingest
        WHERE outcome.status = 'failed'
        UNION ALL
        SELECT 'transaction ' || transaction_id, 'warnings', CAST(outcome.result->'$.warnings' AS VARCHAR)
        FROM ingest
        WHERE (outcome.result->'$.warnings') IS NOT NULL
        ORDER BY subject
      message: "{subject}: {outcome}: {detail}"
      max_rows: 100

runtime:
  state:
    sqlite: ../../.streamwright/google_data_manager_conversions_by_action_name.state.db
    scope: "account:{{ config.operating_account }}"
