[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamwright-restapi"
version = "0.0.1"
description = "StreamWright - Generic REST API / HTTP connector"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Karthick Jaganathan", email = "kjaganathan.sde@gmail.com"},
]
keywords = ["data", "pipeline", "etl", "connector", "rest", "restapi", "http"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "streamwright~=0.1.0",
]

[project.urls]
Homepage = "https://streamwright.web.app"
Documentation = "https://streamwright.web.app/docs/"
Repository = "https://github.com/karthick-jaganathan/streamwright"
"Issue Tracker" = "https://github.com/karthick-jaganathan/streamwright/issues"

[project.entry-points."streamwright.connectors"]
restapi = "streamwright.connectors.restapi.connector:RestApiConnector"
http = "streamwright.connectors.restapi.connector:HttpConnector"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["streamwright.connectors.restapi"]
