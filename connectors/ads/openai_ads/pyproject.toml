[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamwright-openai-ads"
version = "0.0.4"
description = "StreamWright - OpenAI Ads connector"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Karthick Jaganathan", email = "kjaganathan.sde@gmail.com"},
]
keywords = ["data", "pipeline", "etl", "connector", "openai-ads"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
dependencies = [
    "streamwright~=0.1.10",
]

[project.urls]
Homepage = "https://streamwright.web.app"
Documentation = "https://streamwright.web.app/docs/"
Repository = "https://github.com/karthick-jaganathan/streamwright"
"Issue Tracker" = "https://github.com/karthick-jaganathan/streamwright/issues"

[project.entry-points."streamwright.connectors"]
openai_ads = "streamwright.connectors.openai_ads:CONNECTOR"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["streamwright.connectors.openai_ads"]

[tool.setuptools.package-data]
"streamwright.connectors.openai_ads" = ["guide.md"]
