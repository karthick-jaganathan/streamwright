[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamwright-mysql"
version = "0.0.1"
description = "StreamWright - MySQL connector (read-only queries and table reads on MySQL; DuckDBJob and SparkJob table writes)"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Karthick Jaganathan", email = "kjaganathan.sde@gmail.com"},
]
keywords = ["data", "pipeline", "etl", "mysql", "database"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
# DuckDB is provided by streamwright (duckdb>=1.5.2)
dependencies = [
    "streamwright~=0.1.10",
]

[project.optional-dependencies]
spark = ["streamwright-spark[spark]~=0.1.0", "pymysql>=1.1"]

[project.urls]
Homepage = "https://streamwright.web.app"
Documentation = "https://streamwright.web.app/docs/"
Repository = "https://github.com/karthick-jaganathan/streamwright"
"Issue Tracker" = "https://github.com/karthick-jaganathan/streamwright/issues"

# Connector contract v1 (docs/design/connector-contract.md): one entry point, the CONNECTOR definition; engines load
# its adapters (engines/source.py, engines/duckdb.py, engines/spark.py) when a job uses them.
[project.entry-points."streamwright.connectors"]
mysql = "streamwright.connectors.mysql:CONNECTOR"

[tool.setuptools]
# src layout: streamwright and streamwright.connectors are namespace packages shared with the other StreamWright distributions
package-dir = {"" = "src"}
packages = ["streamwright.connectors.mysql", "streamwright.connectors.mysql.engines"]

[tool.setuptools.package-data]
"streamwright.connectors.mysql" = ["guide.md"]
