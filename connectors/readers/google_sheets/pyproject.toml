[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamwright-google-sheets"
version = "0.0.1"
description = "StreamWright - Google Sheets connector (read-only row streaming from spreadsheets via Google Sheets API v4)"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Karthick Jaganathan", email = "kjaganathan.sde@gmail.com"},
]
keywords = ["data", "pipeline", "etl", "google-sheets", "spreadsheets", "gsuite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
dependencies = [
    "streamwright~=0.1.10",
    "google-auth>=2.20.0",
]

[project.optional-dependencies]
spark = ["streamwright-spark[spark]~=0.1.0"]

[project.urls]
Homepage = "https://streamwright.web.app"
Documentation = "https://streamwright.web.app/docs/"
Repository = "https://github.com/karthick-jaganathan/streamwright"
"Issue Tracker" = "https://github.com/karthick-jaganathan/streamwright/issues"

[project.entry-points."streamwright.connectors"]
google_sheets = "streamwright.connectors.google_sheets:CONNECTOR"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["streamwright.connectors.google_sheets", "streamwright.connectors.google_sheets.engines"]

[tool.setuptools.package-data]
"streamwright.connectors.google_sheets" = ["guide.md"]
