[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamwright-gcs"
version = "0.0.2"
description = "StreamWright - gcs connector (csv, tsv, json, jsonl and parquet objects in Google Cloud Storage, read with DuckDB)"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Karthick Jaganathan", email = "kjaganathan.sde@gmail.com"},
]
keywords = ["data", "pipeline", "etl", "gcs", "google cloud storage", "object storage", "csv", "parquet", "duckdb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
# DuckDB installs its httpfs extension on the first connect (or ahead of time: INSTALL httpfs)
dependencies = [
    "streamwright~=0.1.9",
]

[project.optional-dependencies]
spark = ["streamwright-spark[spark]~=0.1.0"]

[project.urls]
Homepage = "https://streamwright.web.app"
Documentation = "https://streamwright.web.app/docs/"
Repository = "https://github.com/karthick-jaganathan/streamwright"
"Issue Tracker" = "https://github.com/karthick-jaganathan/streamwright/issues"

# Connector contract v1 (docs/design/connector-contract.md): one entry point, the CONNECTOR definition; engines load
# its adapters (engines/source.py, engines/duckdb.py, engines/spark.py) when a job uses them.
[project.entry-points."streamwright.connectors"]
gcs = "streamwright.connectors.gcs:CONNECTOR"

[tool.setuptools]
# src layout: streamwright and streamwright.connectors are namespace packages shared with the other StreamWright distributions
package-dir = {"" = "src"}
packages = ["streamwright.connectors.gcs", "streamwright.connectors.gcs.engines"]

[tool.setuptools.package-data]
"streamwright.connectors.gcs" = ["guide.md"]
